[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "renpy-vita-studio"
version = "0.1.0"
description = "Safe inspection and preparation tools for user-supplied Ren'Py projects targeting PlayStation Vita."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "SPDW Factory" }]
dependencies = []

[project.scripts]
renpy-vita-studio = "renpy_vita_studio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
