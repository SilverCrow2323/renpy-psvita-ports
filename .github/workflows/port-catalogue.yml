name: Ren'Py Vita catalogue validation
on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "catalog/**"
      - "schemas/**"
      - "docs/**"
      - "tools/validate_port_catalog.py"
      - "tests/test_port_catalog.py"
      - ".github/workflows/port-catalogue.yml"
  pull_request:
    paths:
      - "catalog/**"
      - "schemas/**"
      - "docs/**"
      - "tools/validate_port_catalog.py"
      - "tests/test_port_catalog.py"
      - ".github/workflows/port-catalogue.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Test catalogue validation
        run: python -m unittest discover -s tests -p 'test_port_catalog.py'
      - name: Validate catalogue and documentation
        run: python tools/validate_port_catalog.py
