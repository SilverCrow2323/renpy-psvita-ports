name: Ren'Py Vita Studio Core

on:
  push:
    branches: [main]
    paths:
      - "tooling/renpy-vita-studio/**"
      - ".github/workflows/renpy-vita-studio.yml"
  pull_request:
    branches: [main]
    paths:
      - "tooling/renpy-vita-studio/**"
      - ".github/workflows/renpy-vita-studio.yml"

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run standard-library test suite
        env:
          PYTHONPATH: tooling/renpy-vita-studio/src
        run: python -m unittest discover -s tooling/renpy-vita-studio/tests -v
      - name: Check CLI entry point
        env:
          PYTHONPATH: tooling/renpy-vita-studio/src
        run: python -m renpy_vita_studio --help
